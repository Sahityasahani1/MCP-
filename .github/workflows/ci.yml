name: CI Quality Gate & Benchmark Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt -r mcp_server/requirements.txt pytest

    - name: Run Multi-Source Discovery Benchmark
      run: |
        python tests/test_multi_source.py

    - name: Run Phase 1 Production Benchmark Audit (BR-01 to BR-06)
      run: |
        python tests/test_phase1_production.py

    - name: Run Phase 2 Backend & HITL Gate Benchmark
      run: |
        python tests/test_phase2_backend.py

    - name: Run Phase 4 Security & DevSecOps Benchmark
      run: |
        python tests/test_phase4_security_devops.py
