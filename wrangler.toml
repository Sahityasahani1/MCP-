# Cloudflare Pages / Workers Deployment Configuration
name = "amra-research-agent"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages build output configuration
pages_build_output_dir = "frontend/.next"

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_EDGE_CACHE_ENABLED = "true"
NEXT_PUBLIC_CLOUDFLARE_EDGE = "true"
