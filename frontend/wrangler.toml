# Cloudflare Pages / Workers Deployment Configuration for Frontend
name = "amra-frontend"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = ".next"

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_EDGE_CACHE_ENABLED = "true"
NEXT_PUBLIC_CLOUDFLARE_EDGE = "true"
